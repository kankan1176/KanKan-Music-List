name: Stop public ShareLiScore site
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stop-public-site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  unpublish:
    if: github.repository == 'kankan1176/KanKan-Music-List' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Save Pages configuration and unpublish without deleting source or data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const fs=require('node:fs');
          (async()=>{
            const endpoint='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/pages';
            const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
            fs.mkdirSync('.public-site-stop',{recursive:true});
            const before=await fetch(endpoint,{headers});
            if(before.status===200){
              const config=await before.json();fs.writeFileSync('.public-site-stop/pages-before.json',JSON.stringify(config,null,2));
              const response=await fetch(endpoint,{method:'DELETE',headers});
              if(response.status!==204)throw Error('Pages unpublish rejected: HTTP '+response.status+' '+await response.text());
            }else if(before.status!==404)throw Error('Cannot read Pages configuration: HTTP '+before.status);
            const check=await fetch(endpoint,{headers});
            if(check.status!==404)throw Error('Pages remains configured: HTTP '+check.status);
            fs.writeFileSync('.public-site-stop/result.json',JSON.stringify({pagesUnpublished:true,checkedAt:new Date().toISOString()},null,2));
            console.log('PASS: GitHub Pages is unpublished. Repository and Firebase data retained.');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          JS
      - name: Verify public entry URLs no longer serve the app
        run: |
          node <<'JS'
          (async()=>{
            const paths=['/','/mylist.html','/obs.html','/admin.html'];let results=[];
            for(let attempt=0;attempt<12;attempt++){
              results=await Promise.all(paths.map(async path=>{try{const response=await fetch('https://kankan1176.com'+path+'?publication-stop='+Date.now(),{redirect:'follow',signal:AbortSignal.timeout(15000)});return{path,status:response.status};}catch{return{path,status:0};}}));
              if(results.every(row=>row.status===404||row.status===410||row.status===0))break;
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            require('node:fs').writeFileSync('.public-site-stop/public-check.json',JSON.stringify(results,null,2));
            console.log('PUBLIC_STOP_CHECK '+JSON.stringify(results));
            if(results.some(row=>row.status!==404&&row.status!==410&&row.status!==0))throw Error('Public cache has not stopped serving the app yet');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site-stop-backup-${{ github.run_id }}
          path: .public-site-stop/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
