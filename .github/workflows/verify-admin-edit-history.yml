name: Verify administrator edits and history
on:
  push:
    branches: [main, codex/admin-edit-history-20261103]
    paths:
      - 'song-edit-service.js'
      - 'admin-song-history.js'
      - 'admin-mylist-service.js'
      - 'scripts/*rules.cjs'
      - 'tests/free-controls/test-song-history.cjs'
      - '.github/workflows/verify-admin-edit-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node scripts/check-song-history.cjs && node scripts/check-admin-mylist.cjs && node scripts/check-admin-list-design.cjs
      - run: npm ci --prefix tests/free-controls --ignore-scripts --no-audit --no-fund
      - name: Verify authorization and history on synthetic records only
        run: tests/free-controls/node_modules/.bin/firebase emulators:exec --project demo-free-controls --only database --config tests/free-controls/firebase.json 'node tests/free-controls/test-rules.cjs && node tests/free-controls/test-song-history.cjs && node tests/free-controls/test-admin-list-design.cjs'
