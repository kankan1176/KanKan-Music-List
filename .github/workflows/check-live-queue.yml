name: Verify live queue permissions without publishing rules
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-live-queue.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tests/free-controls --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Test live policy against synthetic room data only
        run: tests/free-controls/node_modules/.bin/firebase emulators:exec --project demo-queue-audit --only database --config tests/free-controls/firebase.json 'node scripts/check-live-queue.cjs'
