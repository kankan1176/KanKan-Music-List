name: Verify public search in browser
on:
  push:
    branches: [main]
    paths: ['scripts/check-public-search-browser.cjs', '.github/workflows/check-public-search-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-public-search-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-search-verification
          path: public-search-verification.png
          if-no-files-found: ignore
