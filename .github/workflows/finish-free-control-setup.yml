name: Finish free control setup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-free-control-setup.yml']
permissions:
  actions: write
jobs:
  finish:
    if: github.repository == 'kankan1176/KanKan-Music-List' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop the already-applied initializer waiting on an open connection
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/runs/39025816960/cancel"
