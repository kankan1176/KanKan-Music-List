name: Verify BUMP production search
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-bump-search.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false firebase-admin@13
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'JS'
          const {initializeApp,cert,deleteApp}=require('firebase-admin/app'),{getDatabase}=require('firebase-admin/database'),s=require('./song-search-core.js');(async()=>{const app=initializeApp({credential:cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))),databaseURL:'https://kankan-session-room-default-rtdb.asia-southeast1.firebasedatabase.app'});try{const db=getDatabase(app),songs=(await db.ref('songs').get()).val(),key=(await db.ref('songSearchMeta/currentIndexKey').get()).val(),matches=Object.entries(songs).filter(([id,v])=>s.matches(v,'BUMP')),prefix=Buffer.from('bump').toString('hex'),snap=await db.ref('songSearchRows/'+key).orderByKey().startAt(prefix).endAt(prefix+'\\uf8ff').limitToFirst(100).get();const ids=[];snap.forEach(c=>ids.push(c.val()));console.log('BUMP_REPORT '+JSON.stringify({masterMatches:matches.length,embeddedIdMismatch:matches.filter(([id,v])=>v.id&&v.id!==id).length,indexRows:ids.length,uniqueCandidates:new Set(ids).size,candidatesMatching:ids.filter(id=>s.matches(songs[id],'BUMP')).length,candidatesPassingConverter:ids.filter(id=>songs[id]&&(!songs[id].id||songs[id].id===id)).length}));}finally{await deleteApp(app)}})().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
