name: Apply category filters and master
on:
  push:
    branches: [main]
    paths: ['maintenance/master-categories-20261023.enc.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-song-search-index
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'kankan1176/KanKan-Music-List' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false firebase-admin@13
      - run: node scripts/check-category-filters.cjs
      - name: Back up classifications, preserve other fields, add metadata validators
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/migrate-category-master.cjs
      - name: Rebuild bounded category and search indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/build-search-index.mjs
      - name: Verify categories, synth credits and index consistency
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/verify-category-filters.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: category-migration-backup-${{ github.run_id }}
          path: .category-migration/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
