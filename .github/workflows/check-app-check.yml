name: Check App Check integration

on:
  push:
    branches: [main]
    paths:
      - 'chordwiki-version.js'
      - 'chordwiki-preference.js'
      - 'scripts/check-chordwiki-version.cjs'
      - 'artist-classification.js'
      - 'vtuber-master.js'
      - 'data/reference-masters/**'
      - 'scripts/build-reference-masters.cjs'
      - 'scripts/check-artist-classification.cjs'
      - 'song-registration.js'
      - 'song-registration.css'
      - 'scripts/check-song-registration.cjs'
      - 'sort-master.js'
      - 'scripts/check-song-row-rendering.cjs'
      - 'firebase-app-check.js'
      - 'index.html'
      - 'admin.html'
      - 'mylist.html'
      - 'mylist.js'
      - 'obs.html'
      - 'obs-scene.js'
      - 'appcheck-test.html'
      - 'scripts/check-app-check-diagnostic.cjs'
      - 'scripts/check-app-check.cjs'
      - '.github/workflows/check-app-check.yml'
  pull_request:
    paths:
      - 'chordwiki-version.js'
      - 'chordwiki-preference.js'
      - 'scripts/check-chordwiki-version.cjs'
      - 'artist-classification.js'
      - 'vtuber-master.js'
      - 'data/reference-masters/**'
      - 'scripts/build-reference-masters.cjs'
      - 'scripts/check-artist-classification.cjs'
      - 'song-registration.js'
      - 'song-registration.css'
      - 'scripts/check-song-registration.cjs'
      - 'sort-master.js'
      - 'scripts/check-song-row-rendering.cjs'
      - 'firebase-app-check.js'
      - 'index.html'
      - 'admin.html'
      - 'mylist.html'
      - 'mylist.js'
      - 'obs.html'
      - 'obs-scene.js'
      - 'appcheck-test.html'
      - 'scripts/check-app-check-diagnostic.cjs'
      - 'scripts/check-app-check.cjs'
      - '.github/workflows/check-app-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/build-reference-masters.cjs --check
          node scripts/check-artist-classification.cjs
          node scripts/check-song-registration.cjs
          node scripts/check-chordwiki-version.cjs
          node scripts/check-latest-sheet.cjs
          node scripts/check-category-filters.cjs
          node scripts/check-song-row-rendering.cjs
          node scripts/check-app-check.cjs
          node scripts/check-app-check-diagnostic.cjs

