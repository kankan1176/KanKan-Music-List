<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KanKan Setlist for OBS</title>
    
    <!-- Firebase SDK (互換バージョン) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <!-- PapaParse CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: rgba(18, 18, 18, 0.88);
            --panel-bg: rgba(26, 26, 26, 0.92);
            --text-color: #ffffff;
            --primary: #007bff;
            --primary-light: #4da3ff;
            --border-color: rgba(0, 123, 255, 0.4);
            --item-bg: rgba(255, 255, 255, 0.06);
            --item-hover: rgba(255, 255, 255, 0.1);
        }

        /* OBSで高さを変えても崩れないよう全体を柔軟な比率に設定 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            background: transparent !important; /* OBSで背景透過 */
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
            overflow: hidden;
        }

        /* 外枠コンテナ：高さを100%フィットさせて追従 */
        .obs-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 10px;
            padding: 10px 14px;
            box-sizing: border-box;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
        }

        /* ヘッダーエリア（固定高） */
        .obs-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .obs-title {
            margin: 0;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .obs-counter {
            font-size: 13px;
            font-weight: bold;
            background: var(--primary);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* セットリスト領域：幅800pxを活かして2列グリッドで15曲以上を綺麗に配置 */
        #obsCompletedContainer {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            grid-auto-rows: max-content;
            align-content: start;
            gap: 6px 12px;
            overflow-y: auto;
            padding-right: 4px;
            box-sizing: border-box;
        }

        /* OBS上で目障りなスクロールバーを非表示にしつつスクロール可能に保持 */
        #obsCompletedContainer::-webkit-scrollbar {
            display: none;
        }
        #obsCompletedContainer {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 各楽曲アイテム：高さをスリム化して多数の曲を一覧表示 */
        .obs-song-item {
            display: flex;
            align-items: center;
            background: var(--item-bg);
            padding: 5px 8px;
            border-radius: 5px;
            border-left: 3px solid var(--primary);
            font-size: 13px;
            line-height: 1.3;
            box-sizing: border-box;
            min-width: 0;
            backdrop-filter: blur(2px);
        }

        .obs-song-num {
            font-weight: bold;
            color: var(--primary-light);
            font-size: 12px;
            margin-right: 6px;
            flex-shrink: 0;
            width: 22px;
            text-align: right;
        }

        .obs-song-info {
            display: flex;
            align-items: baseline;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            min-width: 0;
        }

        .obs-song-title {
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .obs-song-artist {
            font-size: 11px;
            opacity: 0.75;
            margin-left: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
        }

        .empty-notice {
            grid-column: 1 / -1;
            text-align: center;
            color: #bbb;
            padding: 30px 10px;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="obs-container">
    <div class="obs-header">
        <h2 class="obs-title">🎸 本日のセットリスト</h2>
        <span class="obs-counter" id="songCounter">0 曲</span>
    </div>
    <div id="obsCompletedContainer">
        <div class="empty-notice">データを読み込み中...</div>
    </div>
</div>

<script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyAidXlfliIIHzTFmr06EKDV6Fit-bSThLI",
      authDomain: "kankan-session-room.firebaseapp.com",
      databaseURL: "https://kankan-session-room-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kankan-session-room",
      storageBucket: "kankan-session-room.firebasestorage.app",
      messagingSenderId: "759342880820",
      appId: "1:759342880820:web:9af0af755e35926a281261"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    let allSongsCache = [];

    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9eDly-go13EEWyrFv-cBvdI8oY8YSUNNXyXw6tpP60SqWlFUQC8sPY9hTGRobkxNoQYgq67UBR0Er/pub?output=csv";

    // スプレッドシートから楽曲情報を取得
    Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: true,
        encoding: "UTF-8",
        complete: function(results) {
            const rawData = results.data;
            const headerIndex = rawData.findIndex(row => row.includes("曲名"));
            if (headerIndex !== -1) {
                const headers = rawData[headerIndex];
                allSongsCache = rawData.slice(headerIndex + 1).map((row, idx) => {
                    let obj = { _id: idx.toString() };
                    headers.forEach((h, i) => { obj[h] = row[i] || ''; });
                    return obj;
                });
            }
            if (roomId) {
                initObsRealtimeSync();
            } else {
                document.getElementById('obsCompletedContainer').innerHTML = 
                    '<div class="empty-notice">⚠️ URLに ?room=ルームID が指定されていません</div>';
            }
        },
        error: function() {
            document.getElementById('obsCompletedContainer').innerHTML = 
                '<div class="empty-notice">⚠️ スプレッドシートの取得に失敗しました</div>';
        }
    });

    function initObsRealtimeSync() {
        db.ref('rooms/' + roomId + '/queue').on('value', (snapshot) => {
            const queue = snapshot.val() || {};
            const completedItems = [];

            Object.keys(queue).forEach(qId => {
                const item = queue[qId];
                if (item.status === 'completed') {
                    const songData = allSongsCache.find(r => r._id === item.songId);
                    if (songData) {
                        completedItems.push({ ...item, songData });
                    }
                }
            });

            // 完了順（演奏順）に並び替え
            completedItems.sort((a, b) => a.order - b.order);
            renderObsList(completedItems);
        });
    }

    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function renderObsList(items) {
        const container = document.getElementById('obsCompletedContainer');
        const counter = document.getElementById('songCounter');
        container.innerHTML = '';
        counter.textContent = `${items.length} 曲`;

        if (items.length === 0) {
            container.innerHTML = '<div class="empty-notice">まだ完了した曲はありません...</div>';
            return;
        }

        const countMap = {};
        const circleNumbers = ['','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

        items.forEach((item, index) => {
            const sId = item.songId;
            countMap[sId] = (countMap[sId] || 0) + 1;
            let displayTitle = escapeHtml(item.songData['曲名']);
            if (countMap[sId] > 1) {
                displayTitle += ` ${circleNumbers[countMap[sId]] || `(${countMap[sId]})`}`;
            }

            const div = document.createElement('div');
            div.className = 'obs-song-item';
            div.innerHTML = `
                <span class="obs-song-num">${index + 1}.</span>
                <div class="obs-song-info">
                    <span class="obs-song-title">${displayTitle}</span>
                    <span class="obs-song-artist">/ ${escapeHtml(item.songData['アーティスト'])}</span>
                </div>
            `;
            container.appendChild(div);
        });
    }
</script>

</body>
</html>
